[project]
name = "ling"
version = "0.0.8"
description = "ling：独立的拟人化 AI 角色系统（会话优先）"
readme = "README.md"
requires-python = ">=3.12"
# GNU AGPL-3.0-or-later（网络 copyleft）。
#
# 选它的目的只有一个：**不允许拿了之后不开源**。
# 谁把它作为网络服务提供给别人用，就必须把自己的修改以同一许可公开。
#
# 注意：AGPL **不禁止商业使用**——商用是被允许的，前提是遵守开源义务。
# 想闭源商用的必须另行取得商业授权（双许可，见 README「许可」一节）。
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "qsbb", email = "86879267+qsbb@users.noreply.github.com" }]
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy[asyncio]>=2.0.35,<2.1",
  "asyncpg>=0.29,<1",
  "aiosqlite>=0.20,<1",
  "alembic>=1.13,<2",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "cryptography>=43,<47",
  # OneBot 反向 WebSocket 入站（connectors/onebot/ws_client.py）。
  # 原本靠 uvicorn[standard] 传递进来，但那是间接依赖——
  # 哪天换个 server 实现就会静默消失。
  "websockets>=12,<18",
  # 动图拆帧（domains/media/describe.py）。视觉接口对 GIF 通常只取第一帧，
  # 而第一帧经常是片头/黑场——不拆帧就会出现"她看了动图说这是黑色图片"。
  "pillow>=10,<14",
  # FishAudio TTS 的请求体是 msgpack（`Content-Type: application/msgpack`），
  # 不是 JSON——见 `models/fish_audio.py`。纯 Python，无编译依赖。
  "msgpack>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  # 并行跑用例：CI 上 3126 个用例串行要 35 分钟，4 核上并行约 10 分钟。
  "pytest-xdist>=3.6,<4",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
]
# SILK 编解码：**只有 OneBot/NapCat 语音条发送需要**，所以做成可选 extra。
#
# ## 为什么不是主依赖
#
# 不装它项目照常跑（只是没有 OneBot 语音条发送能力）；装上才有。C 扩展塞进
# 主依赖会让所有部署都被迫下载它，而 Web、qqbot、微信这些渠道根本用不到
# SILK（§17.3："绝不把所有渠道都喂 SILK"）。
#
# ## 为什么是 pysilk-mod 而不是 pysilk
#
# `pysilk`（PyPI 上 0.0.1）是个**空壳包**：646 字节的 sdist，`setup.py` 里
# `packages=[]`，没有任何源码，装了也 import 不出来（2026-11-11 下载核实）。
# `pysilk-mod` 才是真正打包了编解码器的那个：预编译 wheel 覆盖
# cp38–cp313 / manylinux x86_64+aarch64 / macOS / Windows，零运行时依赖，
# 不需要用户机器有编译器。
#
# ## 许可提示
#
# `pysilk-mod` 内部打包的是**腾讯 SILK SDK 的二进制**，PyPI metadata 只写
# "see LICENSE"。本项目是 AGPL-3.0-or-later；把它做成**可选 extra + 可替换
# 实现**（`connectors/onebot/silk.py` 的 `SilkEncoder` 协议）就是为了让部署方
# 自行决定是否接受该依赖，换实现不需要改上层任何代码。
#
# ## 光有它还不够
#
# 解码与**真重采样**到 24 kHz 走 `ffmpeg`（镜像需 `apt-get install ffmpeg`，
# 见 deploy/Dockerfile.api）。缺任何一半都会明确报错并给安装指引，绝不降级
# 发原始 wav/mp3——NapCat 收到非 SILK 会去调宿主机上不存在的
# `ntsilk_s16le` muxer，用户一条语音都收不到。
speech-codecs = ["pysilk-mod>=1.6.4,<2"]
# 本地开发/CI 使用的便携 PostgreSQL（无 Docker 时的真实数据库测试）
# 便携 PostgreSQL 由 scripts/dev_pg.sh 在 Python 3.11 侧 venv 安装（pgserver 无 cp313 wheel）

[project.scripts]
ling-api = "ling.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ling", "connectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
asyncio_mode = "auto"
markers = [
  "w0_web: W0 Web 定向回归（允许在任何阶段运行）",
  "w1_qq: W1 QQ 专项（W3 之前不得运行）",
  "w2_module: W2 模块专项（W3 之前不得运行）",
]
# 默认排除 W1/W2 专项：避免无筛选的全量 pytest 顺带执行未获准用例。
# W3 时用 -m "w1_qq or w2_module" 显式启动。
addopts = "-q -m 'not w1_qq and not w2_module'"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.12"
packages = ["ling"]
ignore_missing_imports = true
warn_unused_ignores = false
