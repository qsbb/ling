name: release

# 只从稳定版 tag 触发：vX.Y.Z（预发布/构建后缀一律不触发）。
# 发布前必须同时满足：
#   1) tag == pyproject.toml version == src/ling/__init__.py __version__
#      == clients/web-console/package.json version；
#   2) tag 指向的提交是 main 的祖先（fetch-depth: 0）；
#   3) 复用 ci.yml 的全部检查并且全部通过。
# 之后才 gh release create。源码 tag/commit 就是更新源：这里不构建、不下载、
# 不上传任何可执行资产，也没有 descriptor/HMAC。
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# 默认最小权限；只有 release job 需要写 contents。
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 祖先检查要完整历史与 main 引用
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 校验 tag 与三处版本号
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/check_release.py --tag "$RELEASE_TAG" --check-ancestor --main-ref origin/main

  ci:
    needs: verify
    # 直接复用日常 CI（push/pull_request 也还照旧触发）。
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
