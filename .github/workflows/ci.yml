name: ci

on:
  push:
    branches: [main]
  pull_request:
  # release.yml 在打 tag 时直接复用这套检查：所有 CI 通过才允许创建 Release。
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    # 集成测试要真实 PostgreSQL（测试不拿 sqlite 冒充），所以起一个服务容器。
    # 少了这段，CI 一推就红，比没有 CI 更糟。
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ling
          POSTGRES_PASSWORD: ling
          POSTGRES_DB: ling_test
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ling"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      LING_TEST_DATABASE_URL: postgresql+asyncpg://ling:ling@127.0.0.1:55432/ling_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装
        run: |
          python -m pip install -U pip build
          pip install -e ".[dev]"
      - name: 静态检查
        run: |
          # deploy/update/executor.py 是最特权的一段代码（直接跑 docker/git/install.sh），
          # 漏检它等于"最坏代码路径没有门禁"——所以和 src 一样进 ruff。
          # 不加 `ruff format --check`：仓库级 format 基线本来就有大量未通过项，
          # 把它开成门禁会逼着一次全仓重排，与本条检查无关。
          ruff check src tests connectors deploy/update
          mypy src connectors
          # 兜底语法检查：执行器即使将来被排除出 ruff，也不能连编译都过不去。
          python -m py_compile deploy/update/*.py
          # 部署脚本也要能被 bash 解析（bash 3.2 兼容；不执行任何命令）。
          for script in deploy/install.sh deploy/entrypoint.sh deploy/backup/*.sh; do
            bash -n "$script"
          done
      - name: 测试
        run: pytest tests -q
        env:
          LING_TEST_MODE: "1"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients/web-console
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: clients/web-console/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
