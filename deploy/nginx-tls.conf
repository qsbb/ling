# ling edge 反代（TLS 版本）。
#
# 何时用这个：只要登录与私聊会经过**公网或不可信网络**，就必须上 TLS。
# 仅通过本机 / 可信 VPN / SSH 隧道访问时，明文 HTTP 是可接受的（默认 nginx.conf）。
#
# 与 nginx.conf 的差别只有 TLS 与跳转；SSE 相关配置完全一致
# （proxy_buffering off 不能省，否则流式回复会被攒成一整段）。

upstream ling_api {
    server api:8080;
    keepalive 32;
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name _;
    # 证书签发（certbot webroot）需要放行这个路径
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 证书路径：自签或 certbot 签发都可以。
    # 自签生成（够用，浏览器会警告）：
    #   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
    #     -keyout certs/privkey.pem -out certs/fullchain.pem \
    #     -subj "/CN=ling.local"
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 只留 TLS 1.2+；旧协议没有理由还开着
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # 安全响应头：反代是最省事的加处
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 32m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # 必须用 $http_host：$host 会抹掉外部 :8443 端口，Origin/Host 比较就会误判成跨域
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # 应用靠这个判断"请求是加密进来的"，用于 cookie Secure 判定与回调地址
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz { proxy_pass http://ling_api; access_log off; }
    location = /readyz  { proxy_pass http://ling_api; access_log off; }

    location /v1/ {
        proxy_pass http://ling_api;
        # SSE 必须不缓冲，否则流式回复失效（与明文配置同理）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://ling_api;
        proxy_read_timeout 60s;
    }
}
