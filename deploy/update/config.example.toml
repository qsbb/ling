# ling 宿主更新执行器配置示例。
#
# 复制到 /etc/ling-update.toml 并按实际路径修改；**不要放在源码 checkout 里**
# （更新通道目录不允许位于 source_root 内，执行器会拒绝）。
[update]
# 已安装的 ling checkout。只在**首次 adopt 之前**作为 compose/备份的来源；
# 一旦 installed.json 记下 live release_root，备份脚本/compose 一律用 live release
# （source_root 可能停在旧代码，绝不从它跑备份或拼 compose）。
source_root = "/srv/ling"
# 宿主私有状态：锁、journal、installed 记录、备份、mirror、release 暂存、日志，
# 以及 compose-overrides/（只修运行 bind 来源的私有 override，0600）。
# 必须是 0700；**不要**挂进 API 容器。
state_dir = "/var/lib/ling-update"
# 与 API 容器共享的通道目录。API 只能写 requests，status 只能读。
requests_dir = "/run/ling-update/requests"
status_dir = "/run/ling-update/status"
# compose 项目名与对外端口（与 deploy/.env 的 LING_EDGE_PORT 保持一致）。
# port 是宿主 edge 的 /readyz 探活端口：只接受 2xx，301 判失败。
project = "ling"
port = 18080
# 原环境文件（绝对路径；可以是 symlink，指向跨 release 共享的原始 env）。
# 执行器只读它；release/deploy/.env 是指向它 realpath 的受控 symlink（不复制
# 内容），install.sh 的安装锁锚点因此与当前部署一致。
env_file = "/srv/ling/deploy/.env"
# 常驻轮询间隔（秒）；心跳也按这个间隔写（最少 1s）。
poll_seconds = 5
# 单次安装（install.sh）允许的最长时间（秒）。超时杀整个进程组：只有阶段
# 标记可读且恰为 build、且进程组确认全部终止时才判 failed（可重试），
# 其余一律 needs_manual（无法证明服务仍停在旧版本）。
max_seconds = 3600
# 容器内 API 用户的 uid/gid（deploy/Dockerfile.api 固定 10001）。
# init 会把 requests_dir 的属组设为 api_gid，权限 0770。
api_uid = 10001
api_gid = 10001
