# ============================================================================
# **Ling 默认不再使用 edge 反代。** 这个文件保留给需要前置反代的用户。
# ============================================================================
# 为什么保留：api 现在是直连入口（compose 里 api 自己发布 LING_PORT，默认 6520，
# 容器内固定监听 6520）。如果要把 ling 暴露到公网、或者想恢复 api 多副本，
# 就需要在 api 前面再放一层反代 —— 那时用这份配置。
#
# 怎么用（**不再是 compose 服务**，Ling 不会替你启动它）：
#   1. 自己在 compose 里加一个 Caddy/nginx 容器，或者用宿主上的 nginx；
#   2. upstream 指到 api 的 6520（不再是 8080）；容器内用服务名 `api:6520`，
#      宿主上用 `127.0.0.1:${LING_PORT}`；
#   3. 把本文件挂到那个容器的 /etc/nginx/conf.d/default.conf；
#   4. 把 api 的发布端口收回内网（`ports` 只留 expose），只暴露反代端口。
#
# 最小可用的 Caddy 等价写法（更省事，自动 HTTPS）：
#   reverse_proxy api:6520 {
#       flush_interval -1   # SSE 必须逐条刷出，等价于 proxy_buffering off
#   }
#
# 下面这些点仍然成立，别删：
# - SSE 必须关闭缓冲，否则流式回复会被 nginx 攒成一整段
# - 长连接超时要够大（真实模型一轮可能几十秒）
# - 多副本时反代是唯一对外入口，api 副本不再发布 host 端口
#
# 注意：body 大小上限现在由 **应用自己** 管（LING_MAX_BODY_BYTES，默认 32MB），
# 这里再写一份 client_max_body_size 只是多一道防线；两边不一致时以较小的为准。
# ling edge 反代：把 / 与 /v1 都转给 api 副本（Compose 内 DNS 轮询）。
#
# 关键点：
# - SSE 必须关闭缓冲，否则流式回复会被 nginx 攒成一整段
# - 长连接超时要够大（真实模型一轮可能几十秒）
# - 只暴露 edge，api 副本不发布 host 端口（多副本会冲突）

upstream ling_api {
    # Compose 的服务名会解析到所有副本；默认轮询即天然负载均衡
    # api 容器内固定监听 6520（不再是 8080）：照抄本文件不会 502
    server api:6520;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 客户端上传媒体（语音/图片）时的上限
    client_max_body_size 32m;

    # SSE：不缓冲、不切分、长超时
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    # 必须用 $http_host：$host 会抹掉外部 :18080 端口，Origin/Host 比较就会误判成跨域
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        proxy_pass http://ling_api;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://ling_api;
        access_log off;
    }

    # 流式与普通 API 走同一规则，但要显式禁缓冲
    location /v1/ {
        proxy_pass http://ling_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://ling_api;
        proxy_read_timeout 60s;
    }
}
