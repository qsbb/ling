# ling edge 反代：把 / 与 /v1 都转给 api 副本（Compose 内 DNS 轮询）。
#
# 关键点：
# - SSE 必须关闭缓冲，否则流式回复会被 nginx 攒成一整段
# - 长连接超时要够大（真实模型一轮可能几十秒）
# - 只暴露 edge，api 副本不发布 host 端口（多副本会冲突）

upstream ling_api {
    # Compose 的服务名会解析到所有副本；默认轮询即天然负载均衡
    server api:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 客户端上传媒体（语音/图片）时的上限
    client_max_body_size 32m;

    # SSE：不缓冲、不切分、长超时
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        proxy_pass http://ling_api;
        access_log off;
    }

    location = /readyz {
        proxy_pass http://ling_api;
        access_log off;
    }

    # 流式与普通 API 走同一规则，但要显式禁缓冲
    location /v1/ {
        proxy_pass http://ling_api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://ling_api;
        proxy_read_timeout 60s;
    }
}
